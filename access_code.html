<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Введите код доступа</title>
    <link rel="stylesheet" href="snowflakes.css"> <!-- Снежинки -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }


        main {
            padding: 30px;
            width: 30%;
            max-width: 400px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.2);
            background: gainsboro;
            border-radius: 16px;
            margin-top: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        input[type="text"] {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 20px;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            margin: 5px 0
        }

        button:hover {
            background-color: #808080;
        }
    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="Chainsaw Man - 10.mp4" type= "video/mp4">
        </video> 
    <header>
        <h1>Добро пожаловать!</h1>
    </header>
    <main>
        <h2>Введите ваш код</h2>
        <form action="success.html" method="POST">
            <input type="text" placeholder="Введите код" required>
            <button type="submit" onclick="window.location.href='uspeh.html'">Продолжить</button>
        </form>
    </main>
    <script src="snowflakes.js"></script> <!-- Снежинки -->
</body>
