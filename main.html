<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="snowflakes.css">  <!-- Подключаем стили для снежинок -->
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 27px;
            width: 39%;
            max-width: 800px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
        }

        .test-list {
            margin-top: 20px;
        }

        .test-item {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        .test-item:hover {
            background-color: #808080;
        }

        .info {
            margin-top: 20px;
            padding: 1px;
            background-color: #f5f5f5;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 18px;
        }

        .info p {
            font-size: 18px;
            margin: 7px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Главная страница</h1>
    </header>
    <main>
        <section class="test-selection">
            <h2>Выберите тест</h2>
            <div class="test-list">
                <button class="test-item" onclick="window.location.href='test.html'">Тест 1</button>
                <button class="test-item" onclick="window.location.href='test2.html'">Тест 2</button>
                <button class="test-item" onclick="window.location.href='test3.html'">Тест 3</button>
            </div>
        </section>
        
        <section class="info">
            <h3>О приложении</h3>
            <p>Доступных тестов: 3</p>
            <p>Цель приложения: помочь Вам пройти тесты и узнать что-то новое!</p>
        </section>
    </main>
    <script src="snowflakes.js"></script>  <!-- Подключаем скрипт для снежинок -->
</body>
</html>
