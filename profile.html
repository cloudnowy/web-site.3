<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="snowflakes.css">  <!-- Подключаем стили для снежинок -->
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }


        main {
            padding: 30px;
            width: 33%;
            max-width: 800px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
            
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
        }

        main1 {
            padding: 35px;
            width: 25%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px ;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #808080;
        }

        
        input[type="password"] {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 20px;
            margin-bottom: 20px;
            margin-top: 7px;
        }

        input[type="email"] {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 20px;
            margin-top: 7px;
        }

        .profile {
            margin-top: 20px;
            padding: 1px;
            background-color: #f5f5f5;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 20px;
        }

        .profile p {
            font-size: 20px;
            margin: 7px;
        }


    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="Chainsaw Man - 10.mp4" type="video/mp4">
    </video>
    <header>
        <h1>Профиль</h1>
    </header>
    <main>
        <h2>Имя</h2>
        <section class="profile">
            <p id="username-display"></p>
        </section>
    </main>
    <main>
        <h2>Роль</h2>
        <section class="profile">
            <p>Пользователь</p>
        </section>
    </main>
   
    <main1>
        <div class="test-main">
            <button onclick="window.location.href='main.html'">Вернуться на главную страницу</button>
        </div>
        <div class="test-main">
            <button id="logout-button">Выйти</button>
        </div>
    </main1>
    <script>
        // Проверка имени пользователя из LocalStorage
        document.addEventListener('DOMContentLoaded', function () {
            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = 'index.html'; // Перенаправление на страницу входа
            } else {
                document.getElementById('username-display').textContent = username;
            }
        });

        // Кнопка "Выйти"
        document.getElementById('logout-button').addEventListener('click', function () {
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        });
    </script>
    <script src="snowflakes.js"></script>
</body>
</html>
