<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопросы</title>
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 40px;
            width: 29%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            text-align: left;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #808080;
        }

        #next-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #next-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="test-title">Тест</h1>
    </header>
    <main>
        <section>
            <div class="question" id="question-container"></div>
            <div class="answers" id="answers-container"></div>
            <button id="next-button" style="display: none;">Следующий вопрос</button>
        </section>
    </main>
    <script>
        const API_BASE = 'https://testback-production-a036.up.railway.app';

        // Получение параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('test_id');

        let questions = []; // Список вопросов
        let currentQuestionIndex = 0; // Индекс текущего вопроса
        let correctAnswers = 0; // Количество правильных ответов

        // Загрузка вопросов
        function fetchQuestions() {
            fetch(`${API_BASE}/questions/${testId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Не удалось загрузить вопросы');
                    }
                    return response.json();
                })
                .then(data => {
                    if (Array.isArray(data.questions)) {
                        questions = data.questions;
                        showQuestion();
                    } else {
                        console.error('Неожиданная структура данных:', data);
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        }

        // Показать текущий вопрос
        function showQuestion() {
            const questionContainer = document.getElementById('question-container');
            const answersContainer = document.getElementById('answers-container');
            const nextButton = document.getElementById('next-button');

            // Очистка контейнеров
            questionContainer.innerHTML = '';
            answersContainer.innerHTML = '';

            // Если вопросов больше нет, завершить тест
            if (currentQuestionIndex >= questions.length) {
                completeTest();
                return;
            }

            const question = questions[currentQuestionIndex];
            questionContainer.textContent = question.content;

            question.answers.forEach(answer => {
                const button = document.createElement('button');
                button.textContent = answer.content;
                button.onclick = () => {
                    if (answer.is_correct) {
                        correctAnswers++;
                    }
                    nextButton.style.display = 'block'; // Показать кнопку "Следующий вопрос"
                };
                answersContainer.appendChild(button);
            });
        }

        // Завершение теста
        function completeTest() {
            const username = prompt('Введите ваше имя для сохранения результата:');
            if (!username) {
                alert('Имя не может быть пустым. Результат не сохранён.');
                return;
            }

            fetch(`${API_BASE}/results`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    test_id: testId,
                    username: username,
                    score: correctAnswers
                })
            })
                .then(response => {
                    if (response.ok) {
                        alert(`Тест завершён! Ваш результат: ${correctAnswers} правильных ответов.`);
                        window.location.href = 'tests.html?discipline_id=1'; // Вернуться к списку тестов
                    } else {
                        alert('Не удалось сохранить результат.');
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        }

        // Обработчик для кнопки "Следующий вопрос"
        document.getElementById('next-button').onclick = () => {
            currentQuestionIndex++;
            document.getElementById('next-button').style.display = 'none'; // Скрыть кнопку
            showQuestion();
        };

        // Вызов функции при загрузке страницы
        document.addEventListener('DOMContentLoaded', fetchQuestions);
    </script>
</body>
</html>
