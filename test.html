<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопросы</title>
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 40px;
            width: 29%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            text-align: left;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #808080;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="test-title">Вопросы</h1>
    </header>
    <main>
        <section>
            <div class="question" id="question-container">
                <!-- Вопросы и ответы -->
            </div>
        </section>
    </main>
    <script>
        const API_BASE = 'https://testback-production-a036.up.railway.app';

        // Получение параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('test_id');

        // Загрузка вопросов
        function fetchQuestions() {
            fetch(`${API_BASE}/questions/${testId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Не удалось загрузить вопросы');
                    }
                    return response.json();
                })
                .then(data => {
                    const container = document.getElementById('question-container');
                    container.innerHTML = ''; // Очистка контейнера

                    if (Array.isArray(data.questions)) {
                        data.questions.forEach(question => {
                            const questionElement = document.createElement('div');
                            questionElement.className = 'question';
                            questionElement.textContent = question.content;

                            const answersContainer = document.createElement('div');
                            answersContainer.className = 'answers';

                            question.answers.forEach(answer => {
                                const button = document.createElement('button');
                                button.textContent = answer.content;
                                button.onclick = () => {
                                    alert(answer.is_correct ? 'Правильно!' : 'Неправильно!');
                                };
                                answersContainer.appendChild(button);
                            });

                            container.appendChild(questionElement);
                            container.appendChild(answersContainer);
                        });
                    } else {
                        console.error('Неожиданная структура данных:', data);
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        }

        // Вызов функции при загрузке страницы
        document.addEventListener('DOMContentLoaded', fetchQuestions);
    </script>
</body>
</html>
