<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты теста</title>
    <link rel="stylesheet" href="snowflakes.css">  <!-- Подключаем стили для снежинок -->
    <style>
       body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 45px;
            width: 29%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px 40px;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background-color: #808080;
        }
        p {
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Результаты теста</h1>
    </header>
    <main>
        <h2>Спасибо за прохождение теста!</h2>
        <p>Ваши ответы были отправлены. Мы скоро предоставим результаты!</p>
    </main>
    <script src="snowflakes.js"></script>  <!-- Подключаем скрипт для снежинок -->
</body>
</html>
