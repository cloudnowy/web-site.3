<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление тестом</title>
    <link rel="stylesheet" href="snowflakes.css">  <!-- Подключаем стили для снежинок -->
    <script defer src="test-management.js"></script>
    <style>
       body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black; 
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 30px;
            width: 29%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px ;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #808080;
        }

            input[type="text"] {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 20px;
        }

        input[type="number"] {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 20px;
            margin-bottom: 20px;
        }
            
        .form-group {
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            margin-bottom: 10px;
        }
        ul li button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="Chainsaw Man - 10.mp4" type= "video/mp4">
        </video>    
    <header>
        <h1 id="test-title">Изменение теста</h1>
    </header>
    <main>
    <div class="form-group">
        <input type="text" id="question-text" placeholder="Введите название вопроса">
        <input type="text" id="question-answers" placeholder="Введите варианты ответов (через запятую)">
        <input type="number" id="correct-answer" placeholder="Правильный индекс ответа (с 0)">
        <button onclick="addQuestion()">Добавить вопрос</button>
        <button onclick="addQuestion()">Просмотреть все вопросы</button>
    </div>
    <ul id="question-list">
        <!-- Здесь будут отображаться вопросы -->
    </ul>
</main>
    <script src="snowflakes.js"></script>  <!-- Подключаем скрипт для снежинок -->
</body>
</html>
