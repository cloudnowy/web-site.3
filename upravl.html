<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение для управления тестами и дисциплинами</title>
    <link rel="stylesheet" href="snowflakes.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        header {
            background-color: gainsboro;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        input[type="text"], textarea {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-family: Arial, sans-serif;
            font-size: 20px;
        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #808080;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .section {
            width: 480px;
            background: gainsboro;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="Chainsaw Man - 10.mp4" type="video/mp4">
    </video>
    <header>
        <h1>Управление тестами и дисциплинами</h1>
    </header>
    <div class="container">
        <section class="section">
            <h2>Создать тест</h2>
            <input type="text" id="test-title" placeholder="Название теста">
            <input type="text" id="discipline-id" placeholder="ID дисциплины">
            <button onclick="createTest()">Создать</button>
        </section>

        <section class="section">
            <h2>Создать дисциплину</h2>
            <input type="text" id="discipline-title" placeholder="Название дисциплины">
            <textarea id="discipline-description" placeholder="Описание дисциплины"></textarea>
            <button onclick="createDiscipline()">Создать</button>
        </section>

        <section class="section">
            <h2>Удалить тест</h2>
            <input type="text" id="delete-test-id" placeholder="ID теста">
            <button onclick="deleteTest()">Удалить</button>
        </section>

        <section class="section">
            <h2>Удалить дисциплину</h2>
            <input type="text" id="delete-discipline-id" placeholder="ID дисциплины">
            <button onclick="deleteDiscipline()">Удалить</button>
        </section>

        <section class="section">
            <h2>Список дисциплин</h2>
            <button onclick="fetchDisciplines()">Показать</button>
            <ul id="discipline-list"></ul>
        </section>

        <section class="section">
            <h2>Список тестов</h2>
            <input type="text" id="view-tests-discipline-id" placeholder="ID дисциплины">
            <button onclick="fetchTests()">Показать</button>
            <ul id="test-list"></ul>
        </section>
    </div>
    <script>
        const API_BASE = 'https://testback-production-a036.up.railway.app';

        function createTest() {
            const title = document.getElementById('test-title').value;
            const disciplineId = document.getElementById('discipline-id').value;

            fetch(`${API_BASE}/tests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, discipline_id: disciplineId })
            })
                .then(response => response.ok ? alert('Тест создан') : alert('Ошибка создания теста'))
                .catch(console.error);
        }

        function createDiscipline() {
            const title = document.getElementById('discipline-title').value;
            const description = document.getElementById('discipline-description').value;

            fetch(`${API_BASE}/disciplines`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            })
                .then(response => response.ok ? alert('Дисциплина создана') : alert('Ошибка создания дисциплины'))
                .catch(console.error);
        }

        function deleteTest() {
            const testId = document.getElementById('delete-test-id').value;

            fetch(`${API_BASE}/tests/${testId}`, { method: 'DELETE' })
                .then(response => response.ok ? alert('Тест удалён') : alert('Ошибка удаления теста'))
                .catch(console.error);
        }

        function deleteDiscipline() {
            const disciplineId = document.getElementById('delete-discipline-id').value;

            fetch(`${API_BASE}/disciplines/${disciplineId}`, { method: 'DELETE' })
                .then(response => response.ok ? alert('Дисциплина удалена') : alert('Ошибка удаления дисциплины'))
                .catch(console.error);
        }

        function fetchDisciplines() {
            fetch(`${API_BASE}/disciplines`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('discipline-list');
                    list.innerHTML = '';
                    data.disciplines.forEach(discipline => {
                        const li = document.createElement('li');
                        li.textContent = `${discipline.id}: ${discipline.title} - ${discipline.description}`;
                        list.appendChild(li);
                    });
                })
                .catch(console.error);
        }

        function fetchTests() {
            const disciplineId = document.getElementById('view-tests-discipline-id').value;

            fetch(`${API_BASE}/tests/${disciplineId}`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('test-list');
                    list.innerHTML = '';
                    data.tests.forEach(test => {
                        const li = document.createElement('li');
                        li.textContent = `${test.id}: ${test.title}`;
                        list.appendChild(li);
                    });
                })
                .catch(console.error);
        }
    </script>
    <script src="snowflakes.js"></script>
</body>
</html>
