<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение для тестирования</title>
    <link rel="stylesheet" href="snowflakes.css">  <!-- Подключаем стили для снежинок -->
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            background-color: #151515;
            color: black; 
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        header {
            background-color: gainsboro;
            color: black;
            padding: 20px;
            text-align: center;
            width: 85%;
            border-radius: 24px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 45px;
            width: 29%;
            max-width: 600px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            background: gainsboro;
            border-radius: 24px;
            margin-top: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
            margin-top: 10px;

        }

        button {
            background-color: #454545;
            color: white;
            border: none;
            padding: 14px ;
            margin: 5px 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background-color: #808080;
        }
		input[type="text"], input[type="password"] {
        width: 95%; /* Увеличиваем ширину поля */
        padding: 20px; /* Увеличиваем отступы внутри поля */
        margin: 15px 0; /* Добавляем больше пространства между полями */
        border: 2px solid #ccc; /* Более заметная граница */
        border-radius: 16px; /* Закругляем углы */
        font-size: 22px; /* Увеличиваем размер текста */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Добавляем тень */
    }

    input[type="text"]:focus, input[type="password"]:focus {
        border-color: #007BFF; /* Меняем цвет границы при фокусе */
        outline: none; /* Убираем стандартное выделение */
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.5); /* Добавляем подсветку при фокусе */
    }
        /* Базовые стили */
    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="Chainsaw Man - 10.mp4" type="video/mp4">
    </video>
    <header>
        <h1>Сайт для проведения тестирования</h1>
    </header>
    <main>
	<section class="login">
            <h2>Вход</h2>
            <a href = "https://your-api-endpoint.com/auth/yandex" tagret = "_blank">
            <button id="login-yandex">Войти через Yandex ID</button>
        </a>
            <a href = "https://your-api-endpoint.com/auth/github" tagret = "_blank"> 
            <button id="login-github">Войти через GitHub</button>
        </a>
       
            <h2>Вход</h2>
           <input type="text" id="username" placeholder="Введите логин" required>
            <input type="password" id="password" placeholder="Введите пароль" required>
            <button id="login-button">Войти</button>
            <p id="error-message" style="color: red; display: none;">Неверный логин или пароль</p>
        </section>
    </main> 
    <script>
        document.getElementById('login-button').addEventListener('click', function () {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Проверка заглушки
            if (username === "Иван_Петров" && password === "ivan1234") {
                localStorage.setItem('username', 'Иван Петров'); // Сохраняем имя пользователя
                window.location.href = 'main.html'; // Переход на главную страницу
            } else {
                const errorMessage = document.getElementById('error-message');
                errorMessage.style.display = 'block';
            }
        });
    </script>
    <script src="snowflakes.js"></script>
</body>
</html>
