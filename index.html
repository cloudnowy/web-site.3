<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение для массового тестирования</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Добро пожаловать в приложение для массового тестирования</h1>
    </header>
    <main>
        <section class="login">
            <h2>Вход</h2>
            <button id="login-yandex">Войти через Yandex ID</button>
            <button id="login-github">Войти через GitHub</button>
            <form id="code-login">
                <label for="access-code">Введите код доступа:</label>
                <input type="text" id="access-code" name="access-code" required>
                <button type="submit">Войти</button>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
